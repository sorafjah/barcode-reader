<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>100均レジ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body { height: 100%; }

body {
  font-family: 'BIZ UDPGothic', sans-serif;
  background-color: #FFF8E1;
  color: #3E2723;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

ruby rt { font-size: 0.5em; font-weight: 400; }

button {
  font-family: 'BIZ UDPGothic', sans-serif;
  min-height: 44px;
  min-width: 44px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* ========== スタート画面 ========== */
#start-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100dvh;
  padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
}

#start-screen h1 {
  font-size: 34px;
  color: #E65100;
  margin: 8px 0 4px;
  text-align: center;
}

#start-screen .lead {
  font-size: 17px;
  color: #6D4C41;
  margin-bottom: 18px;
  text-align: center;
  line-height: 1.7;
}

.setting-toggle-btn {
  width: 56px;
  height: 56px;
  font-size: 30px;
  line-height: 1;
  color: #E65100;
  background-color: transparent;
  border: none;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.setting-toggle-btn:active { opacity: 0.6; }

.setting-card {
  width: 100%;
  max-width: 560px;
  background-color: #fff;
  border: 3px solid #FFCC80;
  border-radius: 16px;
  padding: 14px 14px 18px;
  margin-bottom: 16px;
}

.setting-card > h2 {
  font-size: 17px;
  color: #E65100;
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 2px dotted #FFCC80;
}

.setting-row { margin-bottom: 16px; }
.setting-row:last-child { margin-bottom: 0; }

.setting-label {
  font-size: 16px;
  font-weight: 700;
  color: #5D4037;
  margin-bottom: 6px;
}

.setting-note {
  font-size: 13px;
  color: #8D6E63;
  margin-top: 6px;
  line-height: 1.6;
}

.choice-group { display: flex; flex-wrap: wrap; gap: 8px; }

.choice-btn {
  flex: 1 1 100px;
  font-size: 16px;
  font-weight: 700;
  color: #795548;
  background-color: #FFF3E0;
  border: 3px solid #FFCC80;
  border-radius: 12px;
  padding: 12px 6px;
}

.choice-btn.selected {
  color: #fff;
  background-color: #FB8C00;
  border-color: #EF6C00;
}

.number-box { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.step-btn {
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  background-color: #FB8C00;
  border: none;
  border-radius: 12px;
  width: 54px;
  height: 48px;
  line-height: 1;
}
.step-btn:active { background-color: #EF6C00; }

.number-box input {
  font-family: 'BIZ UDPGothic', sans-serif;
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  color: #E65100;
  width: 96px;
  height: 48px;
  border: 3px solid #FFCC80;
  border-radius: 12px;
  background-color: #FFFDE7;
  -webkit-user-select: text;
  user-select: text;
}

.number-unit { font-size: 16px; font-weight: 700; color: #795548; }

.start-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

#start-btn {
  font-size: 24px;
  font-weight: 700;
  color: #fff;
  background-color: #FF6D00;
  border: none;
  border-radius: 16px;
  padding: 18px 32px;
  box-shadow: 0 5px 0 #BF360C;
  transition: transform .08s;
}
#start-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #BF360C; }

/* ========== メイン画面 ========== */
#main-screen {
  display: none;
  flex-direction: column;
  min-height: 100dvh;
}

.header {
  display: flex;
  align-items: stretch;
  gap: 8px;
  padding: 8px 8px 6px;
  background-color: #FF6D00;
}

.info-box {
  flex: 1;
  background-color: #fff;
  border-radius: 12px;
  padding: 6px 6px 8px;
  text-align: center;
}

.info-label { font-size: 13px; font-weight: 700; color: #A1887F; }

.info-value { font-size: 30px; font-weight: 700; color: #E65100; line-height: 1.1; }

.btn-setting {
  flex: 0 0 auto;
  font-size: 14px;
  font-weight: 700;
  color: #E65100;
  background-color: #FFE0B2;
  border: none;
  border-radius: 12px;
  padding: 6px 10px;
  width: 60px;
}

.product-bar {
  text-align: center;
  padding: 6px 8px 8px;
  background-color: #FF6D00;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
}

.scanner-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px;
  gap: 8px;
}

.reader-wrap {
  position: relative;
  width: 100%;
  max-width: 420px;
  touch-action: none;
}

#reader {
  width: 100%;
  border-radius: 14px;
  overflow: hidden;
  background-color: #EFEBE9;
  min-height: 180px;
}

#reader video { display: block; width: 100% !important; border-radius: 14px; }

#guide-frame {
  position: absolute;
  left: 8%;
  right: 8%;
  top: 28%;
  bottom: 28%;
  border: 4px solid #43A047;
  border-radius: 10px;
  pointer-events: none;
  transition: border-color .15s;
}
#guide-frame.waiting { border-color: #BDBDBD; }
#guide-frame.hit { border-color: #FFD600; }

.scan-message {
  font-size: 19px;
  font-weight: 700;
  color: #E65100;
  min-height: 30px;
  text-align: center;
  line-height: 1.4;
}
.scan-message.wait { color: #8D6E63; }

.err-detail {
  font-size: 12px;
  color: #8D6E63;
  text-align: center;
  line-height: 1.6;
  max-width: 420px;
  -webkit-user-select: text;
  user-select: text;
  display: none;
}

.start-err {
  width: 100%;
  max-width: 560px;
  font-size: 14px;
  color: #BF360C;
  background-color: #FFEBEE;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 14px;
  line-height: 1.7;
  text-align: left;
  display: none;
  -webkit-user-select: text;
  user-select: text;
}

#retry-cam-btn {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  background-color: #1E88E5;
  border: none;
  border-radius: 12px;
  padding: 10px 18px;
  box-shadow: 0 4px 0 #1565C0;
  display: none;
}
#retry-cam-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1565C0; }

.button-area {
  padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.btn-pay {
  width: 100%;
  max-width: 420px;
  font-size: 24px;
  font-weight: 700;
  color: #fff;
  background-color: #7CB342;
  border: none;
  border-radius: 14px;
  padding: 16px 12px;
  box-shadow: 0 5px 0 #558B2F;
  transition: transform .08s;
}
.btn-pay:active { transform: translateY(4px); box-shadow: 0 1px 0 #558B2F; }
.btn-pay:disabled { background-color: #CFD8DC; box-shadow: 0 5px 0 #B0BEC5; }

.sub-row { display: flex; gap: 8px; width: 100%; max-width: 420px; }

.btn-sub {
  flex: 1;
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  background-color: #8D6E63;
  border: none;
  border-radius: 14px;
  padding: 12px 6px;
  box-shadow: 0 4px 0 #5D4037;
  transition: transform .08s;
}
.btn-sub:active { transform: translateY(3px); box-shadow: 0 1px 0 #5D4037; }
.btn-sub:disabled { background-color: #D7CCC8; box-shadow: 0 4px 0 #BCAAA4; }

.btn-plus { background-color: #26A69A; box-shadow: 0 4px 0 #00796B; }
.btn-plus:active { box-shadow: 0 1px 0 #00796B; }

/* ========== おかいけい画面 ========== */
#payment-screen {
  display: none;
  position: fixed;
  inset: 0;
  background-color: rgba(62, 39, 35, 0.55);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.payment-card {
  background-color: #fff;
  border-radius: 20px;
  padding: 28px 20px;
  text-align: center;
  width: 100%;
  max-width: 420px;
}

.pay-label { font-size: 20px; font-weight: 700; color: #8D6E63; margin-bottom: 6px; }
.pay-total { font-size: 40px; font-weight: 700; color: #E65100; line-height: 1.2; }
.pay-count { font-size: 17px; color: #A1887F; margin: 6px 0 22px; }

.btn-next {
  width: 100%;
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  background-color: #43A047;
  border: none;
  border-radius: 14px;
  padding: 18px 10px;
  box-shadow: 0 5px 0 #1B5E20;
  transition: transform .08s;
}
.btn-next:active { transform: translateY(4px); box-shadow: 0 1px 0 #1B5E20; }

.flash { animation: flashAnim .35s ease-out; }
@keyframes flashAnim {
  0% { background-color: #FFE082; }
  100% { background-color: #fff; }
}

#reader__dashboard,
#reader__header_message,
#reader__status_span,
#reader__dashboard_section_swaplink,
#reader__filescan_input,
#reader__dashboard_section_fsr { display: none !important; }
#reader__scan_region { border: none !important; }
#reader__scan_region img { display: none !important; }

@media (orientation: landscape) and (max-height: 560px) {
  .info-value { font-size: 24px; }
  #reader { min-height: 140px; }
  .reader-wrap { max-width: 320px; }
  .btn-pay { font-size: 20px; padding: 12px; }
}
</style>
</head>

<body>

<!-- ===== スタート画面 ===== -->
<div id="start-screen">
  <h1>100<ruby>均<rt>きん</rt></ruby>レジ</h1>

  <div class="start-err" id="start-err"></div>

  <div class="setting-card" id="setting-card" style="display:none;">
    <h2>せんせいの せってい</h2>

    <div class="setting-row">
      <div class="setting-label">よみとりの ゆるさ</div>
      <div class="choice-group" id="loose-group">
        <button class="choice-btn" data-loose="1">きびしめ</button>
        <button class="choice-btn selected" data-loose="2">ゆるめ</button>
        <button class="choice-btn" data-loose="3">ゆるゆる</button>
      </div>
      <div class="setting-note" id="loose-note"></div>
    </div>

    <div class="setting-row">
      <div class="setting-label">つぎに はんのうするまでの あいだ</div>
      <div class="number-box">
        <button class="step-btn" onclick="stepCooldown(-1)">▽</button>
        <input type="text" inputmode="decimal" id="cooldown-input" value="2.0">
        <button class="step-btn" onclick="stepCooldown(1)">△</button>
        <span class="number-unit"><ruby>秒<rt>びょう</rt></ruby></span>
      </div>
      <div class="setting-note">みじかいほど よく はんのうするよ。0.6〜5.0<ruby>秒<rt>びょう</rt></ruby>まで。</div>
    </div>

    <div class="setting-row">
      <div class="setting-label"><ruby>商品<rt>しょうひん</rt></ruby>の ねだん</div>
      <div class="choice-group" id="pricemode-group">
        <button class="choice-btn selected" data-pricemode="fixed">きまった ねだん</button>
        <button class="choice-btn" data-pricemode="random">ランダム</button>
      </div>

      <div id="fixed-price-box" style="margin-top:10px;">
        <div class="number-box">
          <button class="step-btn" onclick="stepPrice(-1)">▽</button>
          <input type="text" inputmode="numeric" id="price-input" value="110">
          <button class="step-btn" onclick="stepPrice(1)">△</button>
          <span class="number-unit"><ruby>円<rt>えん</rt></ruby></span>
        </div>
      </div>

      <div id="random-price-box" style="margin-top:10px; display:none;">
        <div class="setting-label" style="font-size:14px; margin-bottom:4px;">いちばん やすい ねだん</div>
        <div class="number-box">
          <button class="step-btn" onclick="stepRandomMin(-1)">▽</button>
          <input type="text" inputmode="numeric" id="random-min-input" value="50">
          <button class="step-btn" onclick="stepRandomMin(1)">△</button>
          <span class="number-unit"><ruby>円<rt>えん</rt></ruby></span>
        </div>
        <div class="setting-label" style="font-size:14px; margin:12px 0 4px;">いちばん たかい ねだん</div>
        <div class="number-box">
          <button class="step-btn" onclick="stepRandomMax(-1)">▽</button>
          <input type="text" inputmode="numeric" id="random-max-input" value="500">
          <button class="step-btn" onclick="stepRandomMax(1)">△</button>
          <span class="number-unit"><ruby>円<rt>えん</rt></ruby></span>
        </div>
        <div class="setting-note">スキャンするたびに、この はんいから ねだんを えらぶよ。</div>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-label">おと</div>
      <div class="choice-group">
        <button class="choice-btn selected" id="beep-btn" onclick="toggleBeep()">ピッ<ruby>音<rt>おん</rt></ruby> あり</button>
        <button class="choice-btn selected" id="speak-btn" onclick="toggleSpeak()">よみあげ あり</button>
      </div>
    </div>
  </div>

  <div class="start-row">
    <button id="start-btn" onclick="startApp()">レジを はじめる</button>
    <button id="toggle-setting-btn" class="setting-toggle-btn" onclick="toggleSettingCard()">⚙️</button>
  </div>
</div>

<!-- ===== メイン画面 ===== -->
<div id="main-screen">
  <div class="header">
    <div class="info-box" id="total-box">
      <div class="info-label"><ruby>合計<rt>ごうけい</rt></ruby></div>
      <div class="info-value" id="total-display">0円</div>
    </div>
    <div class="info-box">
      <div class="info-label">かず</div>
      <div class="info-value" id="count-display">0個</div>
    </div>
    <button class="btn-setting" onclick="backToSetting()">せって<br>い</button>
  </div>
  <div class="product-bar" id="product-bar">1つ 110円の <ruby>商品<rt>しょうひん</rt></ruby></div>

  <div class="scanner-area">
    <div class="reader-wrap" id="reader-wrap">
      <div id="reader"></div>
      <div id="guide-frame"></div>
    </div>
    <div class="scan-message" id="scan-msg">バーコードを かざしてね</div>
    <div class="err-detail" id="err-detail"></div>
    <button id="retry-cam-btn" onclick="restartScanner()">カメラを ひらきなおす</button>
  </div>

  <div class="button-area">
    <button class="btn-pay" id="pay-btn" onclick="showPayment()" disabled>おかいけい</button>
    <div class="sub-row">
      <button class="btn-sub" id="cancel-btn" onclick="cancelScan()" disabled>1つ とりけす</button>
      <button class="btn-sub btn-plus" onclick="manualAdd()"><ruby>手<rt>て</rt></ruby>で 1つ ふやす</button>
    </div>
  </div>
</div>

<!-- ===== おかいけい画面 ===== -->
<div id="payment-screen">
  <div class="payment-card">
    <div class="pay-label">おかいけい</div>
    <div class="pay-total" id="pay-total">0円</div>
    <div class="pay-count" id="pay-count">0個</div>
    <button class="btn-next" onclick="resetApp()">ありがとう ございました</button>
  </div>
</div>

<script>
/* =========================================================
   せってい
   ========================================================= */
const LOOSE_PRESET = {
  1: { stripe:false, note:'バーコードが きちんと よめたときだけ はんのうするよ。' },
  2: { stripe:true,  minTr:14, minCon:48, needLines:2, note:'バーコードが よめなくても、しまもようが 見えたら はんのうするよ。' },
  3: { stripe:true,  minTr:8,  minCon:26, needLines:1, note:'すこし ぶれても ななめでも はんのうするよ。バーコードじゃない ものにも はんのうすることが あります。' }
};

const settings = {
  loose:2, cooldown:2.0,
  priceMode:'fixed',   // 'fixed' または 'random'
  price:110,
  randomMin:50, randomMax:500,
  beep:true, speak:true
};

/* =========================================================
   じょうたい
   ========================================================= */
let totalAmount = 0;
let scanCount = 0;
let html5QrCode = null;
let isScanning = false;
let lastHitTime = 0;
let audioCtx = null;
let rafId = null;
let prevTs = 0, sampleAcc = 0, uiAcc = 0;
let waitingShown = false;

/* =========================================================
   ようそ
   ========================================================= */
const startScreen  = document.getElementById('start-screen');
const mainScreen   = document.getElementById('main-screen');
const paymentScreen= document.getElementById('payment-screen');
const totalDisplay = document.getElementById('total-display');
const countDisplay = document.getElementById('count-display');
const totalBox     = document.getElementById('total-box');
const scanMsg      = document.getElementById('scan-msg');
const errDetail    = document.getElementById('err-detail');
const retryCamBtn  = document.getElementById('retry-cam-btn');
const payBtn       = document.getElementById('pay-btn');
const cancelBtn    = document.getElementById('cancel-btn');
const payTotal     = document.getElementById('pay-total');
const payCount     = document.getElementById('pay-count');
const guideFrame   = document.getElementById('guide-frame');
const readerWrap   = document.getElementById('reader-wrap');
const productBar   = document.getElementById('product-bar');
const looseNote    = document.getElementById('loose-note');
const cooldownInput= document.getElementById('cooldown-input');
const priceInput   = document.getElementById('price-input');
const pricemodeGroup = document.getElementById('pricemode-group');
const fixedPriceBox  = document.getElementById('fixed-price-box');
const randomPriceBox = document.getElementById('random-price-box');
const randomMinInput = document.getElementById('random-min-input');
const randomMaxInput = document.getElementById('random-max-input');
const beepBtn      = document.getElementById('beep-btn');
const speakBtn     = document.getElementById('speak-btn');
const toggleSettingBtn = document.getElementById('toggle-setting-btn');

const startErr     = document.getElementById('start-err');
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function showHelp(msg) { startErr.innerHTML = msg; startErr.style.display = 'block'; }
function hideHelp() { startErr.style.display = 'none'; startErr.innerHTML = ''; }

function toggleSettingCard() {
  const card = document.getElementById('setting-card');
  const isOpen = card.style.display !== 'none';
  card.style.display = isOpen ? 'none' : 'block';
  toggleSettingBtn.textContent = isOpen ? '⚙️' : '✕';
}

/* =========================================================
   せってい UI
   ========================================================= */
document.querySelectorAll('#loose-group .choice-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    settings.loose = parseInt(btn.dataset.loose, 10);
    document.querySelectorAll('#loose-group .choice-btn')
      .forEach(b => b.classList.toggle('selected', b === btn));
    looseNote.textContent = LOOSE_PRESET[settings.loose].note;
  });
});
looseNote.textContent = LOOSE_PRESET[settings.loose].note;

function stepCooldown(dir) {
  let v = parseFloat(cooldownInput.value);
  if (isNaN(v)) v = 2.0;
  v = Math.round((v + dir * 0.2) * 10) / 10;
  v = Math.min(5.0, Math.max(0.6, v));
  settings.cooldown = v;
  cooldownInput.value = v.toFixed(1);
}
cooldownInput.addEventListener('change', () => {
  let v = parseFloat(cooldownInput.value);
  if (isNaN(v)) v = 2.0;
  v = Math.min(5.0, Math.max(0.6, Math.round(v * 10) / 10));
  settings.cooldown = v;
  cooldownInput.value = v.toFixed(1);
});

function stepPrice(dir) {
  let v = parseInt(priceInput.value, 10);
  if (isNaN(v)) v = 110;
  v = Math.min(9990, Math.max(10, v + dir * 10));
  settings.price = v;
  priceInput.value = v;
}
priceInput.addEventListener('change', () => {
  let v = parseInt(priceInput.value, 10);
  if (isNaN(v)) v = 110;
  v = Math.min(9990, Math.max(10, v));
  settings.price = v;
  priceInput.value = v;
});

/* ---- 値段モード（きまった／ランダム）---- */
document.querySelectorAll('#pricemode-group .choice-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    settings.priceMode = btn.dataset.pricemode;
    document.querySelectorAll('#pricemode-group .choice-btn')
      .forEach(b => b.classList.toggle('selected', b === btn));
    fixedPriceBox.style.display  = (settings.priceMode === 'fixed')  ? 'block' : 'none';
    randomPriceBox.style.display = (settings.priceMode === 'random') ? 'block' : 'none';
  });
});

function stepRandomMin(dir) {
  let v = parseInt(randomMinInput.value, 10);
  if (isNaN(v)) v = 50;
  v = Math.min(9990, Math.max(10, v + dir * 10));
  if (v > settings.randomMax) v = settings.randomMax;
  settings.randomMin = v;
  randomMinInput.value = v;
}
randomMinInput.addEventListener('change', () => {
  let v = parseInt(randomMinInput.value, 10);
  if (isNaN(v)) v = 50;
  v = Math.min(9990, Math.max(10, v));
  if (v > settings.randomMax) v = settings.randomMax;
  settings.randomMin = v;
  randomMinInput.value = v;
});

function stepRandomMax(dir) {
  let v = parseInt(randomMaxInput.value, 10);
  if (isNaN(v)) v = 500;
  v = Math.min(9990, Math.max(10, v + dir * 10));
  if (v < settings.randomMin) v = settings.randomMin;
  settings.randomMax = v;
  randomMaxInput.value = v;
}
randomMaxInput.addEventListener('change', () => {
  let v = parseInt(randomMaxInput.value, 10);
  if (isNaN(v)) v = 500;
  v = Math.min(9990, Math.max(10, v));
  if (v < settings.randomMin) v = settings.randomMin;
  settings.randomMax = v;
  randomMaxInput.value = v;
});

// つぎに かざす 商品の ねだんを きめる（ランダムモード用）
function drawNextPrice() {
  if (settings.priceMode !== 'random') {
    settings.price = clampPrice(settings.price);
    return settings.price;
  }
  const min = settings.randomMin, max = settings.randomMax;
  const amount = Math.floor(Math.random() * ((max - min) / 10 + 1)) * 10 + min;
  settings.price = amount;
  return amount;
}

function clampPrice(v) {
  return Math.min(9990, Math.max(10, v));
}

function toggleBeep() {
  settings.beep = !settings.beep;
  beepBtn.classList.toggle('selected', settings.beep);
  beepBtn.innerHTML = settings.beep
    ? 'ピッ<ruby>音<rt>おん</rt></ruby> あり' : 'ピッ<ruby>音<rt>おん</rt></ruby> なし';
}
function toggleSpeak() {
  settings.speak = !settings.speak;
  speakBtn.classList.toggle('selected', settings.speak);
  speakBtn.textContent = settings.speak ? 'よみあげ あり' : 'よみあげ なし';
  if (settings.speak) {
    if (!cachedJaVoice) loadJapaneseVoice();
    setTimeout(() => speak('よみあげ オン'), 150);
  }
}

/* =========================================================
   カメラの きょかを もらう
   ========================================================= */
async function askCameraPermission() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const err = new Error('mediaDevices がありません');
    err.name = 'NoApiError';
    throw err;
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' } },
    audio: false
  });
  stream.getTracks().forEach(t => t.stop());
  return true;
}

function explainCameraError(err) {
  const name = (err && err.name) ? err.name : 'Error';
  const msg  = (err && err.message) ? err.message : '';
  let help = '<b>カメラが つかえませんでした（' + name + '）</b><br>';

  if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
    help += '・iPhone/iPadなら アドレスバーの「ぁあ」→「Webサイトの設定」→ カメラを「<ruby>許可<rt>きょか</rt></ruby>」に かえてね<br>'
          + '・「<ruby>設定<rt>せってい</rt></ruby>」→ Safari → カメラ も かくにんしてね';
  } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
    help += '・カメラが 見つかりません';
  } else if (name === 'NotReadableError' || name === 'TrackStartError' || name === 'AbortError') {
    help += '・ほかのアプリや タブが カメラを つかっています。とじてから もういちど ためしてね';
  } else if (name === 'NoApiError' || name === 'TypeError') {
    help += '・https:// の アドレスで ひらいてね';
  } else if (name === 'SecurityError') {
    help += '・あんぜんな ページ（https）で ひらいてね';
  } else {
    help += '・' + msg;
  }
  showHelp(help);
}

/* =========================================================
   アプリ かいし
   ========================================================= */
async function startApp() {
  cooldownInput.dispatchEvent(new Event('change'));
  priceInput.dispatchEvent(new Event('change'));
  hideHelp();

  // ここが「ボタンを おした その しゅんかん」。
  // iOS は ユーザー操作の 直後でないと 発話を むしすることが あるため、
  // カメラの 許可（ダイアログで 操作が とぎれる）より 前に、
  // ここで 音声合成を いちど うごかして ロックを といておく。
  unlockSpeech();
  loadJapaneseVoice();

  let camOk = false;
  try {
    await askCameraPermission();
    camOk = true;
  } catch (err) {
    explainCameraError(err);
  }

  if (!camOk) return;

  await enterMainScreen();
}

async function enterMainScreen() {
  initAudio();

  drawNextPrice();
  updateProductBar();

  startScreen.style.display = 'none';
  mainScreen.style.display = 'flex';

  readerWrap.style.display = 'block';
  // iOS は getUserMedia を つづけて よぶと しっぱいすることがあるので すこし まつ
  await sleep(400);
  await startScanner();
  startLoop();
}

// 音声合成の ロックを とく（無音の ひとことを はなす）
function unlockSpeech() {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    u.lang = 'ja-JP';
    speechSynthesis.speak(u);
  } catch (e) { console.warn('Speech unlock:', e); }
}

function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    playBeep(0.01);
  } catch (e) { console.warn('AudioContext:', e); }

  unlockSpeech();
  loadJapaneseVoice();
}

/* =========================================================
   日本語の こえを さがしておく
   iOS の Safari では speechSynthesis.getVoices() が
   すぐには 中身を かえさないことが あるため、
   voiceschanged イベントを まって さがし直す。
   声を明示的に指定しないと、iOSでは 無音のまま
   おわってしまうことがある。
   ========================================================= */
let cachedJaVoice = null;

function pickJapaneseVoice() {
  try {
    const voices = speechSynthesis.getVoices() || [];
    if (voices.length === 0) return null;
    let v = voices.find(v => v.lang === 'ja-JP');
    if (!v) v = voices.find(v => (v.lang || '').toLowerCase().startsWith('ja'));
    return v || null;
  } catch (e) { return null; }
}

function loadJapaneseVoice() {
  cachedJaVoice = pickJapaneseVoice();
  if (cachedJaVoice) return;

  // まだ 読み込めていない → voiceschanged を まつ
  try {
    speechSynthesis.onvoiceschanged = () => {
      cachedJaVoice = pickJapaneseVoice();
    };
  } catch (e) {}

  // 保険：すこし ま って もう一度 さがす
  setTimeout(() => {
    if (!cachedJaVoice) cachedJaVoice = pickJapaneseVoice();
    if (!cachedJaVoice) console.warn('日本語の 読み上げボイスが 見つかりません');
  }, 500);
}

// ページを ひらいた じかんに、日本語の 読み上げボイスを さがしはじめる
// （「レジを はじめる」を おすまえに、ここで じゅんびしておく）
loadJapaneseVoice();

function backToSetting() {
  stopLoop();
  stopScanner();
  paymentScreen.style.display = 'none';
  mainScreen.style.display = 'none';
  startScreen.style.display = 'flex';
}

/* =========================================================
   スキャナー
   html5-qrcode の start() の 第1引数は
   facingMode / deviceId しか うけつけない。
   （width などを 入れると れいがいに なる）
   解像度は はじまったあとに applyConstraints で おねがいする。
   ========================================================= */
function showErrDetail(text) {
  if (!text) { errDetail.style.display = 'none'; errDetail.textContent = ''; return; }
  errDetail.textContent = text;
  errDetail.style.display = 'block';
}

async function startScanner() {
  await stopScanner();
  showErrDetail('');
  retryCamBtn.style.display = 'none';
  setMessage('カメラを ひらいています…', true);

  try {
    html5QrCode = new Html5Qrcode('reader', { verbose: false });
  } catch (e) {
    setMessage('カメラの じゅんびが できませんでした', false);
    showErrDetail('Html5Qrcode: ' + (e && e.message ? e.message : e));
    retryCamBtn.style.display = 'inline-block';
    return;
  }

  // ゆるく読むための設定
  // ・qrbox なし → 画面ぜんたいから さがす
  // ・formatsToSupport なし → ぜんぶの しゅるいを ためす
  // ・fps を 上げる → ぶれても あたるフレームが ふえる
  const config = {
    fps: 20,
    disableFlip: false,
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  };

  // ためす じゅんばん（4だんかい）
  const attempts = [
    { label: 'うしろカメラ', arg: { facingMode: 'environment' } },
    { label: 'うしろカメラ（exact）', arg: { facingMode: { exact: 'environment' } } },
    { label: 'カメラ一覧から', arg: 'AUTO_DEVICE_ID' },
    { label: 'まえカメラ', arg: { facingMode: 'user' } }
  ];

  const errors = [];

  for (let i = 0; i < attempts.length; i++) {
    let arg = attempts[i].arg;

    if (arg === 'AUTO_DEVICE_ID') {
      try {
        const cams = await Html5Qrcode.getCameras();
        if (!cams || cams.length === 0) { errors.push('一覧: カメラなし'); continue; }
        let pick = cams.find(c => /back|rear|背面|環境/i.test(c.label || ''));
        if (!pick) pick = cams[cams.length - 1];
        arg = pick.id;
      } catch (e) {
        errors.push('一覧: ' + (e && e.message ? e.message : e));
        continue;
      }
    }

    try {
      await html5QrCode.start(arg, config, onDecodeSuccess, () => {});
      isScanning = true;
      setMessage('バーコードを かざしてね', false);
      showErrDetail('');
      retryCamBtn.style.display = 'none';
      improveVideoQuality();
      return;
    } catch (e) {
      const name = (e && e.name) ? e.name : '';
      const msg  = (e && e.message) ? e.message : String(e);
      errors.push(attempts[i].label + ': ' + (name ? name + ' / ' : '') + msg);
      try { html5QrCode.clear(); } catch (e2) {}
      await sleep(300);
    }
  }

  // ぜんぶ しっぱい
  isScanning = false;
  setMessage('カメラが ひらけなかったよ。「<ruby>手<rt>て</rt></ruby>で 1つ ふやす」でも れんしゅうできるよ', false);
  showErrDetail(errors.join(' ／ '));
  retryCamBtn.style.display = 'inline-block';
}

async function restartScanner() {
  await startScanner();
}

async function stopScanner() {
  if (html5QrCode) {
    try { if (isScanning) await html5QrCode.stop(); } catch (e) {}
    try { html5QrCode.clear(); } catch (e) {}
  }
  isScanning = false;
}

// はじまったあとで 画質と ピントを おねがいする（しっぱいしても とまらない）
function improveVideoQuality() {
  try {
    const v = document.querySelector('#reader video');
    const track = v && v.srcObject && v.srcObject.getVideoTracks
      ? v.srcObject.getVideoTracks()[0] : null;
    if (!track || !track.applyConstraints) return;
    track.applyConstraints({
      width: { ideal: 1280 },
      height: { ideal: 720 },
      advanced: [{ focusMode: 'continuous' }]
    }).catch(() => {
      track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
    });
  } catch (e) {}
}

function onDecodeSuccess() { registerHit(); }

/* =========================================================
   しまもよう けんしゅつ（ゆるゆるの本体）
   ========================================================= */
const detCanvas = document.createElement('canvas');
detCanvas.width = 240;
detCanvas.height = 150;
const detCtx = detCanvas.getContext('2d', { willReadFrequently: true });

function checkStripes() {
  const preset = LOOSE_PRESET[settings.loose];
  if (!preset.stripe) return false;

  const v = document.querySelector('#reader video');
  if (!v || v.readyState < 2 || !v.videoWidth) return false;

  const vw = v.videoWidth, vh = v.videoHeight;
  const sx = vw * 0.08, sw = vw * 0.84;
  const sy = vh * 0.28, sh = vh * 0.44;

  try {
    detCtx.drawImage(v, sx, sy, sw, sh, 0, 0, detCanvas.width, detCanvas.height);
  } catch (e) { return false; }

  let data;
  try {
    data = detCtx.getImageData(0, 0, detCanvas.width, detCanvas.height).data;
  } catch (e) { return false; }

  const W = detCanvas.width, H = detCanvas.height;
  const LINES = 6;
  let hitLines = 0;

  for (let li = 1; li <= LINES; li++) {
    const y = Math.floor(H * li / (LINES + 1));
    const row = new Float32Array(W);
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      row[x] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
    }
    const g = new Float32Array(W);
    for (let x = 0; x < W; x++) {
      const a = row[Math.max(0, x - 1)], b = row[x], c = row[Math.min(W - 1, x + 1)];
      g[x] = (a + b + c) / 3;
    }
    let min = 255, max = 0;
    for (let x = 0; x < W; x++) { if (g[x] < min) min = g[x]; if (g[x] > max) max = g[x]; }
    const contrast = max - min;
    if (contrast < preset.minCon) continue;

    const mid = (min + max) / 2;
    const hyst = contrast * 0.15;
    let state = g[0] > mid ? 1 : 0;
    let transitions = 0;
    for (let x = 1; x < W; x++) {
      if (state === 1 && g[x] < mid - hyst) { state = 0; transitions++; }
      else if (state === 0 && g[x] > mid + hyst) { state = 1; transitions++; }
    }
    if (transitions >= preset.minTr) hitLines++;
    if (hitLines >= preset.needLines) return true;
  }
  return false;
}

/* =========================================================
   はんのう
   ========================================================= */
let lastAddedPrice = 0; // 直前に加算した金額（とりけし用）

function registerHit() {
  const now = performance.now();
  if (now - lastHitTime < settings.cooldown * 1000) return;
  lastHitTime = now;

  const price = settings.price;
  scanCount++;
  totalAmount += price;
  lastAddedPrice = price;
  updateDisplay();

  setMessage(scanCount + 'つめ　ピッ！　' + price + '円', false);
  guideFrame.classList.add('hit');
  waitingShown = false;

  flashTotal();
  playBeep(0.3);
  speak(priceReading(price));

  drawNextPrice();
  updateProductBar();
}

function manualAdd() {
  const price = settings.price;
  scanCount++;
  totalAmount += price;
  lastAddedPrice = price;
  lastHitTime = performance.now();
  updateDisplay();
  setMessage(scanCount + 'つめ　ふえたよ　' + price + '円', false);
  guideFrame.classList.add('hit');
  waitingShown = false;
  flashTotal();
  playBeep(0.3);
  speak(priceReading(price));

  drawNextPrice();
  updateProductBar();
}

function cancelScan() {
  if (scanCount <= 0) return;
  scanCount--;
  totalAmount = Math.max(0, totalAmount - lastAddedPrice);
  lastHitTime = performance.now();
  updateDisplay();
  setMessage(scanCount === 0
    ? 'バーコードを かざしてね'
    : '1つ とりけしたよ', false);
  flashTotal();
}

function updateProductBar() {
  productBar.innerHTML = '1つ ' + settings.price + '円の <ruby>商品<rt>しょうひん</rt></ruby>';
}

function updateDisplay() {
  totalDisplay.textContent = totalAmount.toLocaleString() + '円';
  countDisplay.textContent = scanCount + '個';
  payBtn.disabled = scanCount === 0;
  cancelBtn.disabled = scanCount === 0;
}

function flashTotal() {
  totalBox.classList.remove('flash');
  void totalBox.offsetWidth;
  totalBox.classList.add('flash');
}

function setMessage(html, isWait) {
  scanMsg.innerHTML = html;
  scanMsg.classList.toggle('wait', !!isWait);
}

/* =========================================================
   ループ（デルタタイム方式）
   ========================================================= */
function startLoop() {
  stopLoop();
  prevTs = 0; sampleAcc = 0; uiAcc = 0;
  rafId = requestAnimationFrame(loop);
}
function stopLoop() {
  if (rafId !== null) cancelAnimationFrame(rafId);
  rafId = null;
}

function loop(ts) {
  const dt = prevTs ? (ts - prevTs) : 0;
  prevTs = ts;
  sampleAcc += dt;
  uiAcc += dt;

  const inCooldown = (ts - lastHitTime) < settings.cooldown * 1000;

  if (sampleAcc >= 120) {
    sampleAcc = 0;
    if (isScanning && !inCooldown) {
      if (checkStripes()) registerHit();
    }
  }

  if (uiAcc >= 150) {
    uiAcc = 0;
    const stillCooling = (ts - lastHitTime) < settings.cooldown * 1000;
    if (stillCooling) {
      guideFrame.classList.add('waiting');
      if (!waitingShown && (ts - lastHitTime) > 450) {
        waitingShown = true;
        setMessage('ちょっと まってね', true);
      }
    } else {
      guideFrame.classList.remove('waiting');
      guideFrame.classList.remove('hit');
      if (waitingShown) {
        waitingShown = false;
        setMessage('つぎの バーコードを かざしてね', false);
      }
    }
  }

  rafId = requestAnimationFrame(loop);
}

/* =========================================================
   おと
   ========================================================= */
function playBeep(volume) {
  if (!settings.beep || !audioCtx) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.16);
  } catch (e) {}
}

// 数字を「ひゃくじゅう」のような よみがな文字列に かえる
// （音声合成に そのまま数字を わたすと まちがった 単位で よむことが あるため）
function numberToJapaneseReading(num) {
  if (num === 0) return 'ゼロ';
  const digits = ['', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな', 'はち', 'きゅう'];
  const units4 = ['', 'せん', 'ひゃく', 'じゅう']; // 4桁の中の位（千・百・十）
  const bigUnits = ['', 'まん', 'おく']; // 万・億

  // 読み不自然になりやすい促音・連濁のゆらぎを最小限だけ補正
  const smallReading = (n) => {
    // n: 0〜9999
    let s = '';
    const sen = Math.floor(n / 1000) % 10;
    const hyaku = Math.floor(n / 100) % 10;
    const juu = Math.floor(n / 10) % 10;
    const ichi = n % 10;

    if (sen > 0) {
      if (sen === 1) s += 'せん';
      else if (sen === 3) s += 'さんぜん';
      else if (sen === 8) s += 'はっせん';
      else s += digits[sen] + 'せん';
    }
    if (hyaku > 0) {
      if (hyaku === 1) s += 'ひゃく';
      else if (hyaku === 3) s += 'さんびゃく';
      else if (hyaku === 6) s += 'ろっぴゃく';
      else if (hyaku === 8) s += 'はっぴゃく';
      else s += digits[hyaku] + 'ひゃく';
    }
    if (juu > 0) {
      if (juu === 1) s += 'じゅう';
      else s += digits[juu] + 'じゅう';
    }
    if (ichi > 0) {
      s += digits[ichi];
    }
    return s;
  };

  let n = Math.floor(Math.abs(num));
  const groups = [];
  while (n > 0) { groups.push(n % 10000); n = Math.floor(n / 10000); }

  let result = '';
  for (let i = groups.length - 1; i >= 0; i--) {
    if (groups[i] === 0) continue;
    const part = smallReading(groups[i]);
    result += part + bigUnits[i];
  }
  return result || 'ゼロ';
}

function priceReading(amount) {
  return numberToJapaneseReading(amount) + 'えん';
}

function speak(text) {
  if (!settings.speak) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 1.0;
    u.volume = 1.0;
    if (!cachedJaVoice) cachedJaVoice = pickJapaneseVoice();
    if (cachedJaVoice) u.voice = cachedJaVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

   おかいけい

async function showPayment() {

  await sleep(300);
  await startScanner();
  startLoop();
}
